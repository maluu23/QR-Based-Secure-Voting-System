<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-warning mb-4">
            Edit Student
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Register Number</label>
                <input type="text" name="register_no"
                       class="form-control"
                       value="{{ student[1] }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" name="student_name"
                       class="form-control"
                       value="{{ student[2] }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email"
                       class="form-control"
                       value="{{ student[3] }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone"
                       class="form-control"
                       value="{{ student[4] }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" name="department"
                       class="form-control"
                       value="{{ student[5] }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Year</label>

                <select name="year" class="form-select">

                    <option value="1st Year"
                    {% if student[6] == "1st Year" %}selected{% endif %}>
                        1st Year
                    </option>

                    <option value="2nd Year"
                    {% if student[6] == "2nd Year" %}selected{% endif %}>
                        2nd Year
                    </option>

                </select>

            </div>

            <button type="submit" class="btn btn-warning">
                Update Student
            </button>

            <a href="/view-students" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
