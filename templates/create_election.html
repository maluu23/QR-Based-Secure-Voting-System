<!DOCTYPE html>
<html>

<head>

    <title>Create Election</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-primary mb-4">
            Create Election
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label>Election Name</label>

                <input
                    type="text"
                    name="election_name"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label>Academic Year</label>

                <input
                    type="text"
                    name="academic_year"
                    class="form-control"
                    placeholder="2026-2027"
                    required>

            </div>

            <div class="mb-3">

                <label>Start Date & Time</label>

                <input
                    type="datetime-local"
                    name="start_datetime"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label>End Date & Time</label>

                <input
                    type="datetime-local"
                    name="end_datetime"
                    class="form-control"
                    required>

            </div>

            <button class="btn btn-primary">
                Create Election
            </button>

            <a href="/admin-dashboard"
               class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
