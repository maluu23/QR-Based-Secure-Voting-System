<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Candidate</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-warning mb-4">
            Edit Candidate
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Election Post
                </label>

                <select name="post_id" class="form-select" required>

                    {% for post in posts %}

                    <option value="{{ post[0] }}"
                    {% if post[0] == candidate[2] %}selected{% endif %}>

                        {{ post[1] }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Manifesto
                </label>

                <textarea
                    name="manifesto"
                    rows="5"
                    class="form-control"
                    required>{{ candidate[3] }}</textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Approval Status
                </label>

                <select
                    name="approval_status"
                    class="form-select">

                    <option value="Approved"
                    {% if candidate[4] == "Approved" %}selected{% endif %}>
                        Approved
                    </option>

                    <option value="Pending"
                    {% if candidate[4] == "Pending" %}selected{% endif %}>
                        Pending
                    </option>

                    <option value="Rejected"
                    {% if candidate[4] == "Rejected" %}selected{% endif %}>
                        Rejected
                    </option>

                </select>

            </div>

            <button
                type="submit"
                class="btn btn-warning">

                Update Candidate

            </button>

            <a href="/view-candidates"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
