<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-primary mb-4">
            Add Student
        </h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}

                    <div class="alert alert-{{ category }} alert-dismissible fade show">

                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <!-- Register Number -->
            <div class="mb-3">

                <label class="form-label">
                    Register Number
                </label>

                <input
                    type="text"
                    name="register_no"
                    class="form-control"
                    placeholder="Enter Register Number"
                    required>

            </div>

            <!-- Student Name -->
            <div class="mb-3">

                <label class="form-label">
                    Student Name
                </label>

                <input
                    type="text"
                    name="student_name"
                    class="form-control"
                    placeholder="Enter Student Name"
                    required>

            </div>

            <!-- Email -->
            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter Email">

            </div>

            <!-- Phone -->
            <div class="mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    placeholder="Enter Phone Number">

            </div>

            <!-- Department -->
            <div class="mb-3">

                <label class="form-label">
                    Department
                </label>

                <input
                    type="text"
                    name="department"
                    class="form-control"
                    placeholder="Enter Department"
                    required>

            </div>

            <!-- Year -->
            <div class="mb-3">

                <label class="form-label">
                    Year
                </label>

                <select
                    name="year"
                    class="form-select"
                    required>

                    <option value="">
                        -- Select Year --
                    </option>

                    <option value="1st Year">
                        1st Year
                    </option>

                    <option value="2nd Year">
                        2nd Year
                    </option>

                </select>

            </div>

            <!-- Password -->
            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required>

            </div>

            <!-- Buttons -->
            <button
                type="submit"
                class="btn btn-primary">

                Save Student

            </button>

            <a
                href="/admin-dashboard"
                class="btn btn-secondary">

                Back

            </a>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
